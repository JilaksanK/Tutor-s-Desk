Name: Build Jilaksan Class Manager APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Initialize Android Project Skeleton
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms android --org com.jilaksan.classmanager .
          fi

      - name: Configure App Name and Biometrics Setup
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # 1. Change App Launcher Name to "Tutor's Desk"
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"Tutor's Desk\"/" $MANIFEST
            
            # 2. Add Face Lock, Fingerprint & General Biometric Permissions
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>' $MANIFEST
          fi
          
          # 3. Magic Script: Automatically Update Kotlin file for Local Auth (Face/Fingerprint Dialog support)
          MAIN_ACTIVITY=$(find android/app/src/main/kotlin -name "MainActivity.kt")
          if [ -f "$MAIN_ACTIVITY" ]; then
            sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' $MAIN_ACTIVITY
            sed -i 's/class MainActivity: FlutterActivity()/class MainActivity: FlutterFragmentActivity()/' $MAIN_ACTIVITY
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: |
          if [ -f "app_icon.png" ]; then
            flutter pub run flutter_launcher_icons
          fi

      - name: Build Standalone Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Class_Batch_Manager_Release
          path: build/app/outputs/flutter-apk/app-release.apk
