name: class_batch_manager
description: "Class & Batch Management System — Jilaksan_K"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # Local SQLite Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Biometric / Face Lock & Secure Storage
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2

  # PDF Generation & Printing/Preview
  pdf: ^3.10.8
  printing: ^5.13.1
  path_provider: ^2.1.3

  # External Links (Social Media Profiles)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - app_icon.png
